<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог актуальных дизайн-материалов: быстрый поиск, фильтры и подсказки по использованию."
    />
    <title>Материалы команды</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0b'/%3E%3Cpath d='M17 17h30v10H27v6h16v9H27v5H17z' fill='%23ff7a00'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261027" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div class="header-bar">
          <p class="eyebrow">Дизайн-команда</p>
        </div>
        <h1>Материалы,<br />которые легко найти</h1>
        <p class="intro">
          Актуальные шаблоны, презентации и&nbsp;инструкции — без поиска по карточкам и&nbsp;комментариям.
        </p>
      </header>

      <section class="weekly-update" id="weekly-update" aria-labelledby="weekly-update-title" hidden>
        <div class="weekly-update-heading">
          <div>
            <p class="weekly-update-label">Обновления каталога <time id="weekly-update-date"></time></p>
            <h2 id="weekly-update-title">Что нового на этой неделе</h2>
          </div>
          <button class="weekly-update-close" id="weekly-update-close" type="button" aria-label="Закрыть обновления" title="Закрыть обновления">×</button>
        </div>
        <p class="weekly-update-text" id="weekly-update-text" hidden></p>
        <div class="weekly-update-links" id="weekly-update-links"></div>
      </section>

      <section class="controls" aria-label="Поиск и фильтры">
        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <label class="sr-only" for="search">Поиск материалов</label>
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Название, продукт или назначение"
          />
          <kbd>/</kbd>
        </div>

        <div class="filter-groups" id="filter-groups"></div>

        <div class="results-bar" aria-live="polite">
          <p id="result-count"></p>
          <button class="reset-button" id="reset-filters" type="button">Сбросить фильтры</button>
        </div>
      </section>

      <section class="catalog" aria-label="Материалы">
        <div class="card-grid" id="card-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-mark" aria-hidden="true">0</div>
          <h2>Ничего не найдено</h2>
          <p>Попробуйте убрать один из фильтров или изменить запрос.</p>
          <button type="button" class="primary-button" id="empty-reset">Показать все материалы</button>
        </div>
      </section>

      <footer class="page-footer">
        <p>Каталог команды</p>
      </footer>
    </main>

    <dialog class="material-dialog" id="material-dialog">
      <div class="dialog-shell">
        <button class="dialog-close" id="dialog-close" type="button" aria-label="Закрыть">
          <span aria-hidden="true">×</span>
        </button>
        <div id="dialog-content"></div>
      </div>
    </dialog>

    <script src="app.js?v=20261027"></script>
  </body>
</html>
